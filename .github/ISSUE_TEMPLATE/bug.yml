name: Bug report
description: Something in Bluetab does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not include personal saved tabs, passwords or tokens.
        Security problems: email support@supertry.net instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the side panel
        2. Click "Save Current Tabs"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Brave
        - Opera
        - Vivaldi
        - Firefox
        - Other
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: e.g. Chrome 142, Firefox 159
  - type: input
    id: bluetab-version
    attributes:
      label: Bluetab version
      description: Shown in chrome://extensions or about:addons.
      placeholder: e.g. 1.0.3
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Plan
      options:
        - Free
        - Pro
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Optional. Errors from the extension's console help a lot (chrome://extensions → Bluetab → service worker, or about:debugging → Bluetab → Inspect).
