name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Test, and Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Turkish Copy Check
        run: npm run ci:turkish

      - name: Forbidden Words Check
        run: npm run ci:forbidden-words

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Unit Tests
        run: npm test -- --runInBand

      - name: Build (Chrome)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Firefox Add-on Lint
        run: npm run lint:firefox

      # Reports known advisories in runtime dependencies without failing the
      # build: fixing them changes the store packages, so updates ship in the
      # next store version. Check this step's log before each release.
      - name: Production Audit
        run: npm audit --omit=dev
        continue-on-error: true
